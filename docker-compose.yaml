services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: musicapi-frontend
    ports:
      - "80:80"
    depends_on:
      - musicapi
    networks:
      - musicapi-network
    restart: on-failure

  musicapi:
    build:
      context: ./musicapi
      dockerfile: Dockerfile
    container_name: musicapi-backend
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_JWT_TOKEN=${SPRING_JWT_TOKEN}
      - SPRING_JWT_EXPIRATION=${SPRING_JWT_EXPIRATION}
      - SPRING_MONGODB_URI=${SPRING_MONGODB_URI}
    depends_on:
      - db
    networks:
      - musicapi-network
    restart: on-failure

  # --- MongoDB Database ---
  db:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - musicapi-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: --bind_ip_all

volumes:
  mongo-data:
    driver: local

networks:
  musicapi-network:
    driver: bridge